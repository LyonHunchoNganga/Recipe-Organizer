<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submit a Recipe - Recipe Organizer</title>
  <link rel="stylesheet" href="./index.css" />
</head>
<body>
  <header>
    <h1>Submit a Recipe</h1>
    <p>Share your favorite dish with the community!</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact-us.html">Contact</a>
    <a href="my-recipes.html">My Recipes</a>
    <a href="submit-recipe.html">Submit Recipe</a>
  </nav>

  <main>
    <h2>Recipe Submission Form</h2>
    <form action="#" method="post">
      <label for="title">Recipe Title:</label><br />
      <input type="text" id="title" name="title" required /><br /><br />

      <label for="category">Category:</label><br />
      <select id="category" name="category" required>
        <option value="">--Choose a category--</option>
        <option value="breakfast">Breakfast</option>
        <option value="lunch">Lunch</option>
        <option value="dinner">Dinner</option>
        <option value="dessert">Dessert</option>
      </select><br /><br />

      <label for="ingredients">Ingredients:</label><br />
      <textarea id="ingredients" name="ingredients" rows="5" placeholder="List all ingredients..." required></textarea><br /><br />

      <label for="instructions">Instructions:</label><br />
      <textarea id="instructions" name="instructions" rows="6" placeholder="Write step-by-step cooking instructions..." required></textarea><br /><br />

      <button type="submit">Submit Recipe</button>
        <button type="reset">Reset</button>
    </form>
  </main>

  <footer>
    &copy; 2025 Recipe Organizer. Created by Lyon Nganga, for everyone.
  </footer>
</body>
</html>
