<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - Recipe Organizer</title>
  <link rel="stylesheet" href="./index.css" />
  
</head>
<body>
  <header>
    <h1>Contact Us</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact-us.html">Contact</a>
      <a href="my-recipes.html">My Recipes</a>
      <a href="submit-recipe.html">Submit Recipe</a>
    </nav>
  </header>

  <main>
    <h2>Love to Hear From You</h2>
    <p>If you have questions, suggestions, or just want to say hello, please fill out the form below. Our team will get back to you as soon as possible.</p>

    <form>
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required />

      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" />

      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </main>

  <footer>
    &copy; 2025 Recipe Organizer. Created by Lyon Nganga, let's stay connected.
  </footer>
</body>
</html>
